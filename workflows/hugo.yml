## **PASO 2: Subir el workflow a GitHub**
```
git add .github/workflows/hugo.yml
```
```
git commit -m "Add GitHub Actions workflow for Hugo deployment"
```
```
git push
```

---

## **PASO 3: Activar GitHub Pages**

1. Ve a tu repositorio: https://github.com/Ciber127/cyberSoul-blog

2. Clic en **"Settings"** (pestaña arriba)

3. En el menú izquierdo, clic en **"Pages"**

4. En **"Source"**, selecciona: **"GitHub Actions"**

5. No necesitas hacer clic en "Save", se guarda automáticamente

---

## **PASO 4: Ver el deploy en acción**

1. Ve a la pestaña **"Actions"** en tu repositorio

2. Verás un workflow corriendo (círculo amarillo girando)

3. Espera 2-3 minutos hasta que aparezca ✅ verde

4. Una vez termine, tu sitio estará en:
```
https://ciber127.github.io/cyberSoul-blog/
```

---

## **PASO 5: Crear tu primer post**

Mientras esperas el deploy, crea contenido:
```
hugo new content/posts/mi-primer-post.md