<aside class="space-y-10">
  <!-- Newsletter -->
  <div class="bg-white p-8 rounded-2xl shadow-xl">
    <h3 class="text-2xl font-bold mb-6">Suscríbete Ahora</h3>
    <p class="text-gray-600 mb-6">Tips semanales directos a tu correo – sin spam.</p>
    <!-- Form (integra tu script o usa Netlify Forms) -->
    <form class="space-y-4">
      <input type="email" placeholder="tu@email.com" class="w-full px-5 py-4 rounded-xl border border-gray-300 bg-transparent"/>
      <button type="submit" class="w-full bg-primary text-white font-bold py-4 rounded-xl">¡Quiero Proteger mi Digital!</button>
    </form>
  </div>

  <!-- Categorías dinámicas -->
  <div class="bg-white p-8 rounded-2xl shadow-xl">
    <h3 class="text-2xl font-bold mb-6">Categorías Populares</h3>
    <ul class="space-y-4 text-lg">
      {{ range $taxonomy := .Site.Taxonomies.categories }}
        <li><a href="{{ $taxonomy.Page.Permalink }}" class="hover:text-primary">{{ $taxonomy.Page.Title }}</a></li>
      {{ end }}
    </ul>
  </div>
</aside>
